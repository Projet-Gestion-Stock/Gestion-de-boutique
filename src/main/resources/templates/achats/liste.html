<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{components/layout :: head('Achats')}"></head>
<body>

<nav th:replace="~{components/layout :: navbar}"></nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 m-0">Historique des achats</h1>
        <div class="d-flex gap-2">
            <a th:unless="${erreurFiltre}" th:href="@{/achats/export/pdf(format='pdf')} + ${filtresUrl}"
               class="btn btn-outline-danger">Exporter en PDF</a>
            <a th:href="@{/achats/nouveau}" class="btn btn-primary">Nouvel achat</a>
        </div>
    </div>

    <div th:replace="~{components/layout :: messages}"></div>

    <!-- Filtres -->
    <form th:action="@{/achats}" method="get" class="card card-body mb-3">
        <div class="row g-2 align-items-end">
            <div class="col-md-3">
                <label for="du" class="form-label small mb-1">Du</label>
                <input type="date" id="du" name="du" th:value="${du}" class="form-control">
            </div>
            <div class="col-md-3">
                <label for="au" class="form-label small mb-1">Au</label>
                <input type="date" id="au" name="au" th:value="${au}" class="form-control">
            </div>
            <div class="col-md-3">
                <label for="caissierId" class="form-label small mb-1">Caissier</label>
                <select id="caissierId" name="caissierId" class="form-select">
                    <option value="">Tous</option>
                    <option th:each="u : ${caissiers}" th:value="${u.id}"
                            th:text="${u.nomComplet + ' (' + u.identifiant + ')'}"
                            th:selected="${caissierId != null and caissierId == u.id}">Caissier</option>
                </select>
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-primary">Filtrer</button>
                <a th:if="${filtreActif}" th:href="@{/achats}" class="btn btn-outline-secondary">Réinitialiser</a>
            </div>
        </div>
        <div class="mt-2 small">
            Raccourcis :
            <a th:href="@{/achats(du=${aujourdhui}, au=${aujourdhui})}">Aujourd'hui</a> ·
            <a th:href="@{/achats(du=${il7Jours}, au=${aujourdhui})}">7 derniers jours</a> ·
            <a th:href="@{/achats(du=${debutMois}, au=${aujourdhui})}">Ce mois</a>
        </div>
    </form>

    <div th:if="${erreurFiltre}" class="alert alert-warning" th:text="${erreurFiltre}"></div>

    <p class="text-muted" th:unless="${erreurFiltre}">
        <strong th:text="${pagination.totalElements}">0</strong> achat(s)
        <span th:if="${filtreActif}">correspondant au filtre</span>
        · Total : <strong th:text="${#numbers.formatDecimal(totalAffiche, 1, 'WHITESPACE', 2, 'COMMA')}">0,00</strong>
    </p>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>N°</th>
                <th>Date</th>
                <th>Caissier</th>
                <th>Client</th>
                <th class="text-center">Produits</th>
                <th class="text-end">Total</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a : ${achats}">
                <td th:text="${a.id}">1</td>
                <td th:text="${#temporals.format(a.dateAchat, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</td>
                <td th:text="${a.utilisateur.nomComplet}">Prénom Nom</td>
                <td th:text="${a.nomClient != null} ? ${a.nomClient} : '-'">-</td>
                <td class="text-center" th:text="${#lists.size(a.lignes)}">0</td>
                <td class="text-end"
                    th:text="${#numbers.formatDecimal(a.total, 1, 'WHITESPACE', 2, 'COMMA')}">0,00</td>
                <td class="text-end">
                    <a th:href="@{/achats/{id}(id=${a.id})}" class="btn btn-sm btn-outline-primary">Détail</a>
                    <a th:href="@{/achats/{id}/ticket(id=${a.id})}" target="_blank" rel="noopener"
                       class="btn btn-sm btn-outline-success">Ticket</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(achats)}">
                <td colspan="7" class="text-center text-muted"
                    th:text="${filtreActif} ? 'Aucun achat ne correspond à ce filtre.' : 'Aucun achat enregistré.'">Aucun achat.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{components/pagination :: pagination(${pagination}, '/achats', ${filtresUrl})}"></div>

</main>

<th:block th:replace="~{components/layout :: scripts}"></th:block>
</body>
</html>
