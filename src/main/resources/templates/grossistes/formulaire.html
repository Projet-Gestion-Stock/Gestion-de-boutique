<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{components/layout :: head('Grossiste')}"></head>
<body>

<nav th:replace="~{components/layout :: navbar}"></nav>

<main class="container py-4">
    <h1 class="h3 mb-4" th:text="${edition} ? 'Modifier un grossiste' : 'Ajouter un grossiste'">Grossiste</h1>

    <form th:object="${grossisteForm}"
          th:action="${edition} ? @{/grossistes/{id}(id=${idGrossiste})} : @{/grossistes}"
          method="post" novalidate>

        <div class="row g-3">
            <div class="col-md-8">
                <label for="nom" class="form-label">Nom du grossiste</label>
                <input type="text" id="nom" th:field="*{nom}" class="form-control"
                       th:classappend="${#fields.hasErrors('nom')} ? 'is-invalid'" autofocus>
                <div class="invalid-feedback" th:errors="*{nom}">Erreur</div>
            </div>

            <div class="col-md-4">
                <label for="telephone" class="form-label">Téléphone (facultatif)</label>
                <input type="text" id="telephone" th:field="*{telephone}" class="form-control"
                       th:classappend="${#fields.hasErrors('telephone')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{telephone}">Erreur</div>
            </div>

            <div class="col-md-8">
                <label for="adresse" class="form-label">Adresse (facultative)</label>
                <input type="text" id="adresse" th:field="*{adresse}" class="form-control"
                       th:classappend="${#fields.hasErrors('adresse')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{adresse}">Erreur</div>
            </div>

            <div class="col-md-4">
                <label for="email" class="form-label">E-mail (facultatif)</label>
                <input type="text" id="email" th:field="*{email}" class="form-control"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{email}">Erreur</div>
            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a th:href="@{/grossistes}" class="btn btn-outline-secondary">Annuler</a>
        </div>
    </form>
</main>

<th:block th:replace="~{components/layout :: scripts}"></th:block>
</body>
</html>
