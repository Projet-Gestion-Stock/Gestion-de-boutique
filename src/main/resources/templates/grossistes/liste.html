<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{components/layout :: head('Grossistes')}"></head>
<body>

<nav th:replace="~{components/layout :: navbar}"></nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 m-0">Grossistes</h1>
        <a th:href="@{/grossistes/nouveau}" class="btn btn-primary">Ajouter un grossiste</a>
    </div>

    <div th:replace="~{components/layout :: messages}"></div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>Nom</th>
                <th>Téléphone</th>
                <th>Adresse</th>
                <th>E-mail</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="g : ${grossistes}">
                <td th:text="${g.nom}">Sahel Distribution</td>
                <td th:text="${g.telephone != null} ? ${g.telephone} : '-'">-</td>
                <td th:text="${g.adresse != null} ? ${g.adresse} : '-'">-</td>
                <td th:text="${g.email != null} ? ${g.email} : '-'">-</td>
                <td class="text-end">
                    <a th:href="@{/grossistes/{id}/modifier(id=${g.id})}"
                       class="btn btn-sm btn-outline-primary">Modifier</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(grossistes)}">
                <td colspan="5" class="text-center text-muted">Aucun grossiste.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<th:block th:replace="~{components/layout :: scripts}"></th:block>
</body>
</html>
