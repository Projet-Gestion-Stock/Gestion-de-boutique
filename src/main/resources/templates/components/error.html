<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{components/layout :: head('Erreur')}"></head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm text-center">
                <div class="card-body p-5">
                    <p class="display-4 text-secondary mb-2" th:text="${status}">404</p>

                    <h1 class="h4 mb-3">
                        <span th:if="${status == 403}">Accès refusé</span>
                        <span th:if="${status == 404}">Page introuvable</span>
                        <span th:if="${status == 409}">Opération impossible</span>
                        <span th:if="${status != 403 and status != 404 and status != 409}">Une erreur est survenue</span>
                    </h1>

                    <p class="text-muted mb-4"
                       th:text="${!#strings.isEmpty(message)} ? ${message} : 'Retournez sur la page principale et réessayez.'">
                        Message
                    </p>

                    <a th:href="@{/}" class="btn btn-primary">Retour à l'accueil</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
