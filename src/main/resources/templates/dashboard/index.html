<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{components/layout :: head('Accueil')}"></head>
<body>

<nav th:replace="~{components/layout :: navbar}"></nav>

<main class="container py-4">
    <h1 class="h3">Bienvenue, <span sec:authentication="name">utilisateur</span></h1>
    <p class="text-muted">L'authentification fonctionne. Le tableau de bord sera construit plus tard.</p>

    <div sec:authorize="hasRole('ADMIN')" class="alert alert-info">
        Vous êtes connecté en tant qu'<strong>administrateur</strong>.
    </div>
    <div sec:authorize="hasRole('CAISSIER')" class="alert alert-secondary">
        Vous êtes connecté en tant que <strong>caissier</strong>.
    </div>
</main>

<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
