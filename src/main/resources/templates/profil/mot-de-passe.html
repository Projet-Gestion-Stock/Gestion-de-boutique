<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{components/layout :: head('Mot de passe')}"></head>
<body>

<th:block th:if="${premiereConnexion}">
    <nav th:replace="~{components/layout :: navbarMinimal}"></nav>
</th:block>
<th:block th:unless="${premiereConnexion}">
    <nav th:replace="~{components/layout :: navbar}"></nav>
</th:block>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <h1 class="h3 mb-3"
                th:text="${premiereConnexion} ? 'Définissez votre mot de passe' : 'Changer mon mot de passe'">Mot de passe</h1>

            <div th:if="${premiereConnexion}" class="alert alert-warning">
                C'est votre première connexion. Pour des raisons de sécurité, vous devez choisir votre propre
                mot de passe avant de continuer.
            </div>

            <form th:object="${motDePasseForm}" th:action="@{/profil/mot-de-passe}" method="post" novalidate>

                <div class="mb-3" th:unless="${premiereConnexion}">
                    <label for="motDePasseActuel" class="form-label">Mot de passe actuel</label>
                    <input type="password" id="motDePasseActuel" th:field="*{motDePasseActuel}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('motDePasseActuel')} ? 'is-invalid'"
                           autocomplete="current-password">
                    <div class="invalid-feedback" th:errors="*{motDePasseActuel}">Erreur</div>
                </div>

                <div class="mb-3">
                    <label for="nouveauMotDePasse" class="form-label">Nouveau mot de passe</label>
                    <input type="password" id="nouveauMotDePasse" th:field="*{nouveauMotDePasse}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('nouveauMotDePasse')} ? 'is-invalid'"
                           autocomplete="new-password">
                    <div class="form-text">Au moins 6 caractères, différent du mot de passe actuel.</div>
                    <div class="invalid-feedback" th:errors="*{nouveauMotDePasse}">Erreur</div>
                </div>

                <div class="mb-3">
                    <label for="confirmation" class="form-label">Confirmer le nouveau mot de passe</label>
                    <input type="password" id="confirmation" th:field="*{confirmation}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('confirmation')} ? 'is-invalid'"
                           autocomplete="new-password">
                    <div class="invalid-feedback" th:errors="*{confirmation}">Erreur</div>
                </div>

                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a th:unless="${premiereConnexion}" th:href="@{/profil}" class="btn btn-outline-secondary">Annuler</a>
            </form>
        </div>
    </div>
</main>

<th:block th:replace="~{components/layout :: scripts}"></th:block>
</body>
</html>
