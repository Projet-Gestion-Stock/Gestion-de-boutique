<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{components/layout :: head('Mon profil')}"></head>
<body>

<nav th:replace="~{components/layout :: navbar}"></nav>

<main class="contenu">

    <div th:replace="~{components/layout :: messages}"></div>

    <div class="carte-mdp-zone mx-auto" style="max-width: 480px;">
        <a th:href="@{/profil}" class="lien-retour">&larr; Retour à mon profil</a>

        <section class="panneau carte-mdp" style="margin-top: 0;">
            <div class="carte-mdp__tete">
                <span class="carte-mdp__icone"><svg class="ico"><use href="#n-bouclier"/></svg></span>
                <div>
                    <h1 class="carte-mdp__titre">Changer mon mot de passe</h1>
                    <p class="panneau__sous-titre">Mettez à jour vos identifiants pour sécuriser votre compte.</p>
                </div>
            </div>

            <form id="formMotDePasse" th:object="${motDePasseForm}" th:action="@{/profil/mot-de-passe}"
                  method="post" novalidate>

                <div class="mb-3">
                    <label for="motDePasseActuel" class="form-label">Mot de passe actuel <span class="text-danger">*</span></label>
                    <div class="champ-icone champ-mdp">
                        <svg class="ico"><use href="#n-cle"/></svg>
                        <input type="password" id="motDePasseActuel" th:field="*{motDePasseActuel}" class="form-control"
                               autocomplete="current-password"
                               th:classappend="${#fields.hasErrors('motDePasseActuel')} ? 'is-invalid'">
                        <button type="button" class="btn-oeil" aria-label="Afficher ou masquer le mot de passe">
                            <svg class="ico"><use href="#n-oeil"/></svg>
                        </button>
                        <div class="invalid-feedback" th:errors="*{motDePasseActuel}">Erreur</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="nouveauMotDePasse" class="form-label">Nouveau mot de passe <span class="text-danger">*</span></label>
                    <div class="champ-icone champ-mdp">
                        <svg class="ico"><use href="#n-cadenas"/></svg>
                        <input type="password" id="nouveauMotDePasse" th:field="*{nouveauMotDePasse}" class="form-control"
                               autocomplete="new-password"
                               th:classappend="${#fields.hasErrors('nouveauMotDePasse')} ? 'is-invalid'">
                        <button type="button" class="btn-oeil" aria-label="Afficher ou masquer le mot de passe">
                            <svg class="ico"><use href="#n-oeil"/></svg>
                        </button>
                        <div class="invalid-feedback" th:errors="*{nouveauMotDePasse}">Erreur</div>
                    </div>
                    <div class="aide-champ">
                        <svg class="ico"><use href="#n-info"/></svg>Au moins 6 caractères, différent du mot de passe actuel.
                    </div>
                </div>

                <div class="mb-3">
                    <label for="confirmation" class="form-label">Confirmer le nouveau mot de passe <span class="text-danger">*</span></label>
                    <div class="champ-icone champ-mdp">
                        <svg class="ico"><use href="#n-bouclier"/></svg>
                        <input type="password" id="confirmation" th:field="*{confirmation}" class="form-control"
                               autocomplete="new-password"
                               th:classappend="${#fields.hasErrors('confirmation')} ? 'is-invalid'">
                        <button type="button" class="btn-oeil" aria-label="Afficher ou masquer le mot de passe">
                            <svg class="ico"><use href="#n-oeil"/></svg>
                        </button>
                        <div class="invalid-feedback" th:errors="*{confirmation}">Erreur</div>
                    </div>
                </div>

                <div class="actions-formulaire actions-formulaire--droite">
                    <a th:href="@{/profil}" class="btn-app">Annuler</a>
                    <button type="submit" class="btn-app btn-app--primaire">
                        <svg class="ico"><use href="#n-check"/></svg>Enregistrer
                    </button>
                </div>
            </form>
        </section>
    </div>
</main>

<th:block th:replace="~{components/layout :: scripts}"></th:block>

<script>
    // Afficher / masquer un mot de passe
    document.getElementById('formMotDePasse').addEventListener('click', function (e) {
        var oeil = e.target.closest('.btn-oeil');
        if (!oeil) { return; }
        var champ = oeil.parentElement.querySelector('input');
        champ.type = champ.type === 'password' ? 'text' : 'password';
    });
</script>
</body>
</html>
