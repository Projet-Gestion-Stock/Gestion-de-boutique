<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{components/layout :: head('Produit')}"></head>
<body>

<nav th:replace="~{components/layout :: navbar}"></nav>

<main class="container py-4">
    <h1 class="h3 mb-4" th:text="${edition} ? 'Modifier un produit' : 'Ajouter un produit'">Produit</h1>

    <div th:if="${#lists.isEmpty(categories)}" class="alert alert-warning">
        Aucune catégorie n'existe. <a th:href="@{/categories/nouveau}">Créez d'abord une catégorie</a>
        pour pouvoir enregistrer un produit.
    </div>

    <form th:object="${produitForm}"
          th:action="${edition} ? @{/produits/{id}(id=${idProduit})} : @{/produits}"
          method="post" novalidate>

        <div class="row g-3">
            <div class="col-md-8">
                <label for="nom" class="form-label">Nom du produit</label>
                <input type="text" id="nom" th:field="*{nom}" class="form-control"
                       th:classappend="${#fields.hasErrors('nom')} ? 'is-invalid'" autofocus>
                <div class="invalid-feedback" th:errors="*{nom}">Erreur</div>
            </div>

            <div class="col-md-4">
                <label for="categorieId" class="form-label">Catégorie</label>
                <select id="categorieId" th:field="*{categorieId}" class="form-select"
                        th:classappend="${#fields.hasErrors('categorieId')} ? 'is-invalid'">
                    <option value="">-- Choisir --</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.nom}">Catégorie</option>
                </select>
                <div class="invalid-feedback" th:errors="*{categorieId}">Erreur</div>
            </div>

            <div class="col-md-4">
                <label for="prixVente" class="form-label">Prix de vente</label>
                <input type="number" step="0.01" min="0" id="prixVente" th:field="*{prixVente}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('prixVente')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{prixVente}">Erreur</div>
            </div>

            <!-- Création : stock initial saisissable -->
            <div class="col-md-4" th:unless="${edition}">
                <label for="quantiteStock" class="form-label">Stock initial</label>
                <input type="number" min="0" step="1" id="quantiteStock" th:field="*{quantiteStock}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('quantiteStock')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{quantiteStock}">Erreur</div>
            </div>

            <!-- Modification : stock en lecture seule (règle P6) -->
            <div class="col-md-4" th:if="${edition}">
                <label class="form-label">Stock actuel</label>
                <input type="text" class="form-control" th:value="${stockActuel}" disabled>
                <div class="form-text">Modifié uniquement par les livraisons et les achats.</div>
            </div>

            <div class="col-md-4">
                <label for="seuilAlerte" class="form-label">Seuil d'alerte</label>
                <input type="number" min="0" step="1" id="seuilAlerte" th:field="*{seuilAlerte}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('seuilAlerte')} ? 'is-invalid'">
                <div class="form-text">Une alerte « Stock faible » s'affiche en dessous de ce niveau.</div>
                <div class="invalid-feedback" th:errors="*{seuilAlerte}">Erreur</div>
            </div>

            <div class="col-md-4">
                <label for="datePeremption" class="form-label">Date de péremption (facultative)</label>
                <input type="date" id="datePeremption" th:field="*{datePeremption}" class="form-control"
                       th:classappend="${#fields.hasErrors('datePeremption')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{datePeremption}">Erreur</div>
            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a th:href="@{/produits}" class="btn btn-outline-secondary">Annuler</a>
        </div>
    </form>
</main>

<th:block th:replace="~{components/layout :: scripts}"></th:block>
</body>
</html>
