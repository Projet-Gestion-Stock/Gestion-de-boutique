<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{components/layout :: head('Nouvel utilisateur')}"></head>
<body>

<nav th:replace="~{components/layout :: navbar}"></nav>

<main class="container py-4">
    <h1 class="h3 mb-4">Ajouter un utilisateur</h1>

    <form th:object="${utilisateurForm}" th:action="@{/utilisateurs}" method="post" novalidate>

        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
            <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">Erreur</div>
        </div>

        <div class="row g-3">
            <div class="col-md-6">
                <label for="nom" class="form-label">Nom</label>
                <input type="text" id="nom" th:field="*{nom}" class="form-control"
                       th:classappend="${#fields.hasErrors('nom')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{nom}">Erreur</div>
            </div>

            <div class="col-md-6">
                <label for="prenom" class="form-label">Prénom</label>
                <input type="text" id="prenom" th:field="*{prenom}" class="form-control"
                       th:classappend="${#fields.hasErrors('prenom')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{prenom}">Erreur</div>
            </div>

            <div class="col-md-4">
                <label for="matricule" class="form-label">Numéro matricule</label>
                <input type="text" id="matricule" th:field="*{matricule}" class="form-control"
                       th:classappend="${#fields.hasErrors('matricule')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{matricule}">Erreur</div>
            </div>

            <div class="col-md-4">
                <label class="form-label d-block">Sexe</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" id="sexeM" th:field="*{sexe}" value="M">
                    <label class="form-check-label" for="sexeM">Masculin</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" id="sexeF" th:field="*{sexe}" value="F">
                    <label class="form-check-label" for="sexeF">Féminin</label>
                </div>
                <div class="text-danger small" th:if="${#fields.hasErrors('sexe')}" th:errors="*{sexe}">Erreur</div>
            </div>

            <div class="col-md-4">
                <label for="dateNaissance" class="form-label">Date de naissance</label>
                <input type="date" id="dateNaissance" th:field="*{dateNaissance}" class="form-control"
                       th:classappend="${#fields.hasErrors('dateNaissance')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{dateNaissance}">Erreur</div>
            </div>

            <div class="col-md-6">
                <label for="identifiant" class="form-label">Identifiant de connexion</label>
                <input type="text" id="identifiant" th:field="*{identifiant}" class="form-control"
                       th:classappend="${#fields.hasErrors('identifiant')} ? 'is-invalid'" autocomplete="off">
                <div class="invalid-feedback" th:errors="*{identifiant}">Erreur</div>
            </div>

            <div class="col-md-6">
                <label for="role" class="form-label">Rôle</label>
                <select id="role" th:field="*{role}" class="form-select"
                        th:classappend="${#fields.hasErrors('role')} ? 'is-invalid'">
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}">ROLE</option>
                </select>
                <div class="invalid-feedback" th:errors="*{role}">Erreur</div>
            </div>

            <div class="col-md-6">
                <label for="motDePasse" class="form-label">Mot de passe provisoire</label>
                <input type="password" id="motDePasse" th:field="*{motDePasse}" class="form-control"
                       th:classappend="${#fields.hasErrors('motDePasse')} ? 'is-invalid'" autocomplete="new-password">
                <div class="form-text">L'utilisateur devra définir son propre mot de passe à sa première connexion.</div>
                <div class="invalid-feedback" th:errors="*{motDePasse}">Erreur</div>
            </div>

            <div class="col-md-6">
                <label for="confirmationMotDePasse" class="form-label">Confirmer le mot de passe</label>
                <input type="password" id="confirmationMotDePasse" th:field="*{confirmationMotDePasse}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('confirmationMotDePasse')} ? 'is-invalid'"
                       autocomplete="new-password">
                <div class="invalid-feedback" th:errors="*{confirmationMotDePasse}">Erreur</div>
            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Créer l'utilisateur</button>
            <a th:href="@{/utilisateurs}" class="btn btn-outline-secondary">Annuler</a>
        </div>
    </form>
</main>

<th:block th:replace="~{components/layout :: scripts}"></th:block>
</body>
</html>
