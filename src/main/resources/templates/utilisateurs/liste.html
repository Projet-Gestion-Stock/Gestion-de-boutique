<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{components/layout :: head('Utilisateurs')}"></head>
<body>

<nav th:replace="~{components/layout :: navbar}"></nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 m-0">Utilisateurs</h1>
        <a th:href="@{/utilisateurs/nouveau}" class="btn btn-primary">Ajouter un utilisateur</a>
    </div>

    <div th:replace="~{components/layout :: messages}"></div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>Matricule</th>
                <th>Nom et prénom</th>
                <th>Identifiant</th>
                <th>Sexe</th>
                <th>Naissance</th>
                <th>Rôle</th>
                <th>Statut</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${utilisateurs}">
                <td th:text="${u.matricule}">MAT-0001</td>
                <td th:text="${u.nom + ' ' + u.prenom}">NOM Prénom</td>
                <td th:text="${u.identifiant}">identifiant</td>
                <td th:text="${u.sexe}">M</td>
                <td th:text="${#temporals.format(u.dateNaissance, 'dd/MM/yyyy')}">01/01/1990</td>
                <td>
                    <span class="badge"
                          th:classappend="${u.role.name() == 'ADMIN'} ? 'bg-warning text-dark' : 'bg-secondary'"
                          th:text="${u.role}">ROLE</span>
                </td>
                <td>
                    <span th:if="${u.actif}" class="badge bg-success">Actif</span>
                    <span th:unless="${u.actif}" class="badge bg-danger">Désactivé</span>
                    <span th:if="${u.doitChangerMotDePasse}" class="badge bg-info text-dark">
                        Mot de passe provisoire
                    </span>
                </td>
                <td class="text-end">
                    <th:block th:if="${u.identifiant != #authentication.name}">

                        <form th:action="@{/utilisateurs/{id}/reinitialiser-mot-de-passe(id=${u.id})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('Réinitialiser le mot de passe de cet utilisateur à 123456 ? Son mot de passe actuel ne fonctionnera plus.');">
                            <button type="submit" class="btn btn-sm btn-outline-secondary">
                                Réinitialiser le mot de passe
                            </button>
                        </form>

                        <form th:if="${u.actif}"
                              th:action="@{/utilisateurs/{id}/desactiver(id=${u.id})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('Désactiver cet utilisateur ?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Désactiver</button>
                        </form>
                        <form th:unless="${u.actif}"
                              th:action="@{/utilisateurs/{id}/activer(id=${u.id})}"
                              method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-success">Réactiver</button>
                        </form>
                    </th:block>
                    <span th:if="${u.identifiant == #authentication.name}" class="text-muted small">
                        Votre compte
                    </span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(utilisateurs)}">
                <td colspan="8" class="text-center text-muted">Aucun utilisateur.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<th:block th:replace="~{components/layout :: scripts}"></th:block>
</body>
</html>
